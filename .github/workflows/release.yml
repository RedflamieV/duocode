# Сборка установщика для Windows и публикация релиза.
# Запускается, когда в main меняется версия в package.json (или вручную).
# Если релиз этой версии уже есть, ничего не делает. DuoCode находит релиз и обновляется сам.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Проверить, нужен ли релиз
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Релиз v$VERSION уже опубликован"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --x64 --publish never
      # latest.yml и .blockmap нужны автообновлению: по ним приложение находит и докачивает версию
      - name: Опубликовать релиз
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" \
            "dist/DuoCode-Setup-$VERSION.exe" \
            "dist/DuoCode-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "DuoCode $VERSION" \
            --notes "Установщик для Windows. Уже установленный DuoCode обновится сам."
